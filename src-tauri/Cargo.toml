[package]
name = "orangedata"
version = "0.1.1"
description = "OrangeData - lightweight visual database client"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-native-tls",
  "sqlite",
  "mysql",
  "postgres",
  "chrono",
  "uuid",
  "json",
  "rust_decimal",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "fs", "process"] }
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
