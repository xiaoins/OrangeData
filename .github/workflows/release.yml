name: Release

# Publish on tag: bump the version, then `git tag vX.Y.Z && git push origin vX.Y.Z`.
# `tag` below re-runs the build for a tag that already exists, without moving the ref.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
          - os: ubuntu-22.04
            rust-targets: ''
            args: --bundles deb,appimage
          - os: windows-latest
            rust-targets: ''
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    env:
      TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build bundles and attach them to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Required: the action only infers the tag from a `release` event. Left unset on a
          # tag push it logs "No releaseId or tagName provided, skipping all uploads" and
          # still exits green, so no release is ever created.
          tagName: ${{ env.TAG_NAME }}
          releaseName: ${{ env.TAG_NAME }}
          releaseDraft: true
          prerelease: ${{ contains(env.TAG_NAME, '-') }}
          args: ${{ matrix.args }}
